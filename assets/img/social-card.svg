  <g stroke="#2bbd8f" stroke-width="4" fill="none" stroke-linecap="round" opacity=".85">
    <path d="M980 470V150"/>
    <path d="M860 168h250"/>
    <path d="M980 150 860 168M980 150l130 18"/>
    <path d="M910 168v52"/>
    <circle cx="910" cy="230" r="10" fill="#2bbd8f" stroke="none"/>
  </g>

