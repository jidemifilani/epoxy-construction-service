  <text x="96" y="268" fill="#ffffff" font-family="Georgia, serif" font-size="74" font-weight="700">Iris Epoxy Service</text>
  <text x="96" y="330" fill="#9fe3c5" font-family="Helvetica, Arial, sans-serif" font-size="27" letter-spacing="5">EPOXY FLOORING SPECIALISTS</text>
  <text x="96" y="398" fill="#ffffff" font-family="Georgia, serif" font-size="40" opacity=".9">Floors that outlast the building around them.</text>
