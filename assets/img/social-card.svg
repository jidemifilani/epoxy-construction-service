    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#ffffff" stroke-width=".8" opacity=".09"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <path d="M0 470h1200v160H0z" fill="url(#floor)"/>
  <path d="M0 470h1200v6H0z" fill="#14a077"/>
  <g stroke="#a9c9e6" stroke-width="1.2" opacity=".5">
    <path d="M0 520h1200M0 575h1200"/>
  </g>

